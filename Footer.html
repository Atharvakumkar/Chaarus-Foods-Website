  <style>
    .font-manrope {
      font-family: 'Manrope', sans-serif;
    }
    
    body.no-scroll {
      overflow: hidden;
    }
    
    .dropdown-menu {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }
    
    .dropdown:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .mobile-dropdown {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .mobile-dropdown.open {
      max-height: 200px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .float-animation {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }

    .cake-card {
      position: relative;
      overflow: hidden;
    }

    .cake-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .price-badge {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      box-shadow: 0 10px 30px rgba(236,72,153,0.4);
      transition: all 0.3s ease;
    }

    .price-badge:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(236,72,153,0.6);
    }

    .text-gradient {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .text-golden {
      color: #DFBD69;
    }

    .bg-golden {
      color: #DFBD69;
    }

    .text-gradient-golden {
      background: linear-gradient(135deg, #DFBD69 0%, #C9A54F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cake-image-container {
      position: relative;
      overflow: visible;
    }

    .cake-image-container::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 30px;
      background: radial-gradient(ellipse, rgba(236,72,153,0.3) 0%, transparent 70%);
      filter: blur(15px);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.8s ease-out;
    }

    .hover-lift {
      transition: all 0.4s ease;
    }

    .hover-lift:hover {
      transform: translateY(-10px);
    }
  </style>
</head>
