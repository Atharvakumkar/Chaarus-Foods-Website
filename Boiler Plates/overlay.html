<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaaru's Foods</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            raleway: ['Raleway', 'sans-serif'],
            dancing: ['Dancing Script', 'cursive'],
          },
        },
      },
    };
  </script>
</head>

<body class="bg-pink-100 font-raleway">
  <header class="shadow py-5 px-5">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-pink-500">
        Chaaru's Foods</h1>
      <i class="fa-solid fa-bars block md:hidden text-2xl text-pink-500 cursor-pointer"></i>
      <ul class="hidden md:flex space-x-4">
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Home</a></li>
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Products</a></li>
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Contact</a></li>
      </ul>
    </div>
  </header>
  
  <section class="container mx-auto px-6 py-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center min-h-[400px]">
      <!-- Left side - Image with text overlay -->
      <div class="h-full relative">
        <img src="assets\Untitled design.png" loading="lazy" alt="Chaaru's Foods" 
             class="w-full h-full object-cover rounded-2xl shadow-2xl" />
        
        <!-- Text Overlay -->
        <div class="absolute inset-0 bg-black bg-opacity-40 rounded-2xl flex items-center justify-center">
          <div class="text-center text-white px-4">
            <h3 class="text-3xl font-bold mb-2">Fresh & Delicious</h3>
            <p class="text-lg">Made with love, served with care</p>
          </div>
        </div>
      </div>
      <!-- Right side - Text content -->
      <div class="text-center md:text-left">
        <h2 class="font-raleway text-5xl font-bold text-pink-400">We make your memories sweet!</h2>
      </div>
    </div>
     
    <div class="text-center mb-8">
      <h2 class="font-dancing text-4xl font-bold text-pink-400 py-10">
        Authentic Indian Flavours & Exquisite Cakes, Crafted with Love</h2>
    </div>
    <div class="flex justify-center mt-8">
      <div class="flex flex-wrap gap-4">
        <button class="bg-zinc-900 text-white font-medium py-2 px-6 rounded hover:bg-zinc-800 transition-colors">Button 1</button>
        <button class="bg-zinc-900 text-white font-medium py-2 px-6 rounded hover:bg-zinc-800 transition-colors">Button 2</button>
      </div>
    </div>
  </section>
  
  <footer class="bg-pink-400 mt-16">
    <div class="bg-pink-400">
    </div>
  </footer>
</body>
</html>
