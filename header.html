<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaaru's Foods</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            raleway: ['Raleway', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    .font-manrope {
      font-family: 'Manrope', sans-serif;
    }
    /* Prevent body scroll when sidebar is open */
    body.no-scroll {
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-pink-100 font-raleway">

  <!-- Header -->
  <header class="shadow py-5 px-5 relative z-20 bg-pink-100">
    <div class="container mx-auto">
      
      <!-- Mobile Header Layout -->
      <div class="flex md:hidden justify-between items-center">
        <!-- Logo for Mobile -->
        <h1 class="text-2xl font-bold text-pink-500">
          Chaaru's Foods
        </h1>
        
        <!-- Hamburger Icon -->
        <i class="fa-solid fa-bars text-2xl text-pink-500 cursor-pointer px-2" onclick="toggleSidebar()"></i>
      </div>

      <!-- Desktop Menu Layout -->
      <div class="hidden md:flex justify-center items-center">
        <ul class="flex space-x-6 items-center">
          <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Home</a></li>
          <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">About Us</a></li>
          <li>
            <h1 class="text-2xl font-bold text-pink-500 px-10">
              Chaaru's Foods
            </h1>
          </li>
          <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Products</a></li>
          <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Contact</a></li>
        </ul>
      </div>
      
    </div>
  </header>

  <!-- Mobile Sidebar -->
  <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-pink-100 shadow-lg transform -translate-x-full transition-transform duration-300 z-40 md:hidden">
    <div class="flex justify-between items-center p-5 border-b">
      <h2 class="text-xl font-bold text-pink-600">Menu</h2>
      <i class="fa-solid fa-times text-2xl text-pink-600 cursor-pointer" onclick="toggleSidebar()"></i>
    </div>
    <ul class="flex flex-col space-y-6 p-6">
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Home</a></li>
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">About Us</a></li>
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Products</a></li>
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Contact</a></li>
    </ul>
  </div>

  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden" onclick="toggleSidebar()"></div>

  <!-- Toggle Sidebar Script -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const body = document.body;

      const isOpen = !sidebar.classList.contains('-translate-x-full');

      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
        body.classList.remove('no-scroll');
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        body.classList.add('no-scroll');
      }
    }
  </script>

</body>
</html>
