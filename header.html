<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaaru's Foods</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            raleway: ['Raleway', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    .font-manrope {
      font-family: 'Manrope', sans-serif;
    }
    /* Prevent body scroll when sidebar is open */
    body.no-scroll {
      overflow: hidden;
    }
    
    /* Dropdown animation */
    .dropdown-menu {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }
    
    .dropdown:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    /* Mobile dropdown animation */
    .mobile-dropdown {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .mobile-dropdown.open {
      max-height: 200px;
    }
  </style>
</head>

<body class="bg-pink-100 font-raleway">

  <header class="shadow py-5 px-5 relative z-20 bg-pink-50 dark:bg-rose-950">
    <div class="container mx-auto">
      
      <!-- Mobile Header Layout -->
      <div class="flex md:hidden justify-between items-center">
        <!-- Logo for Mobile -->
        <h1 class="text-2xl font-bold text-rose-800">
          Chaaru's Foods
        </h1>
        
        <!-- Hamburger Icon -->
        <i class="fa-solid fa-bars text-2xl text-rose-800 cursor-pointer px-2" onclick="toggleSidebar()"></i>
      </div>

      <!-- Desktop Menu Layout -->
      <div class="hidden md:flex justify-center items-center">
        <ul class="flex space-x-6 items-center">
          <li><a href="#" class="font-semibold text-xl text-rose-800 hover:text-pink-500 hover:scale-110 transition-all duration-300">Home</a></li>
          <li><a href="#" class="font-semibold text-xl text-rose-800 hover:text-pink-500 hover:scale-110 transition-all duration-300">About Us</a></li>
          <li>
            <h1 class="text-2xl font-bold text-rose-800 hover:text-pink-500 hover:scale-105 px-10 duration-300 transition-all">
              Chaaru's Foods
            </h1>
          </li>
          <!-- Products Dropdown -->
          <li class="relative dropdown">
            <a href="#" class="font-semibold text-xl text-rose-800 hover:text-pink-500 flex items-center gap-1">
              Products
              <i class="fa-solid fa-chevron-down text-sm"></i>
            </a>
            <!-- Dropdown Menu -->
            <div class="dropdown-menu absolute top-full left-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-rose-200">
              <ul class="py-2">
                <li><a href="#" class="block px-4 py-3 text-rose-700 hover:bg-pink-50 hover:text-rose-800 transition-all duration-200 font-semibold">Traditionals</a></li>
                <li><a href="products__cakes.html" class="block px-4 py-3 text-rose-700 hover:bg-pink-50 hover:text-rose-800 transition-all duration-200 font-semibold">Cakes</a></li>
                <li><a href="#" class="block px-4 py-3 text-rose-700 hover:bg-pink-50 hover:text-rose-800 transition-all duration-200 font-semibold">Diwali Faral</a></li>
                <li><a href="#" class="block px-4 py-3 text-rose-700 hover:bg-pink-50 hover:text-rose-800 transition-all duration-200 font-semibold">Biryani</a></li>
              </ul>
            </div>
          </li>
          <li><a href="contactpage.html" class="font-semibold text-xl text-rose-800 hover:text-pink-500 hover:scale-110 transition-all duration-300">Contact</a></li>
        </ul>
      </div>
      
    </div>
  </header>

  <!-- Mobile Sidebar -->
  <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-pink-50 shadow-lg transform -translate-x-full transition-transform duration-300 z-40 md:hidden">
    <div class="flex justify-between items-center p-5 border-b border-rose-200">
      <h2 class="text-xl font-bold text-rose-800">Menu</h2>
      <i class="fa-solid fa-times text-2xl text-rose-800 cursor-pointer" onclick="toggleSidebar()"></i>
    </div>
    <ul class="flex flex-col space-y-6 p-6">
      <li><a href="#" class="text-lg text-rose-800 font-semibold hover:text-pink-500 transition-colors duration-300">Home</a></li>
      <li><a href="#" class="text-lg text-rose-800 font-semibold hover:text-pink-500 transition-colors duration-300">About Us</a></li>
      <!-- Mobile Products with Dropdown -->
      <li>
        <div class="text-lg text-rose-800 font-semibold cursor-pointer flex items-center justify-between" onclick="toggleMobileDropdown()">
          <span class="hover:text-pink-500 transition-colors duration-300">Products</span>
          <i id="mobile-arrow" class="fa-solid fa-chevron-down text-sm transition-transform duration-300"></i>
        </div>
        <div id="mobile-products-dropdown" class="mobile-dropdown ml-4 mt-2">
          <ul class="space-y-2">
            <li><a href="#" class="block text-base text-rose-600 hover:text-pink-500 transition-colors duration-300 font-semibold">Traditionals</a></li>
            <li><a href="products__cakes.html" class="block text-base text-pink-500 hover:text-pink-500 transition-colors duration-300 font-semibold">Cakes</a></li>
            <li><a href="#" class="block text-base text-rose-600 hover:text-pink-500 transition-colors duration-300 font-semibold">Diwali Faral</a></li>
            <li><a href="#" class="block text-base text-rose-600 hover:text-pink-500 transition-colors duration-300 font-semibold">Biryani</a></li>
          </ul>
        </div>
      </li>
      <li><a href="#" class="text-lg text-rose-800 font-semibold hover:text-pink-500 transition-colors duration-300">Contact</a></li>
    </ul>
  </div>

  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden" onclick="toggleSidebar()"></div>

  <!-- Scripts -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const body = document.body;

      const isOpen = !sidebar.classList.contains('-translate-x-full');

      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
        body.classList.remove('no-scroll');
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        body.classList.add('no-scroll');
      }
    }
    
    function toggleMobileDropdown() {
      const dropdown = document.getElementById('mobile-products-dropdown');
      const arrow = document.getElementById('mobile-arrow');
      
      dropdown.classList.toggle('open');
      arrow.classList.toggle('rotate-180');
    }
  </script>

</body>
</html>
