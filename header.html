<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaaru's Foods</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            raleway: ['Raleway', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="bg-pink-100 font-raleway">

  <!-- Header -->
  <header class="shadow py-5 px-5">
    <div class="container mx-auto flex justify-between items-center relative">
      <!-- Logo -->
      <h1 class="text-2xl font-bold text-pink-500 px-2 md:px-10">
        Chaaru's Foods
      </h1>

      <!-- Hamburger Icon -->
      <i class="fa-solid fa-bars block md:hidden text-2xl text-pink-500 cursor-pointer px-2" onclick="toggleMenu()"></i>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex space-x-6 px-10">
        <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Home</a></li>
        <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Products</a></li>
        <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300">Contact</a></li>
      </ul>
    </div>

    <!-- Mobile Menu -->
    <ul id="mobileMenu" class="hidden md:hidden flex-col items-center space-y-4 py-4 px-6 bg-pink-100 shadow">
      <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 transition-all duration-300">Home</a></li>
      <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 transition-all duration-300">Products</a></li>
      <li><a href="#" class="font-semibold text-xl text-pink-500 hover:text-pink-700 transition-all duration-300">Contact</a></li>
    </ul>
  </header>

  <!-- Toggle Script -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }
  </script>

</body>
</html>
