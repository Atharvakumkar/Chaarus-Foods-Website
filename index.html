<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="3; url=/chaarusFoods.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="1ahG1G7rNFFJcZ_IfLC6N8u1QDVG6R8O8sKW9ivapxI" />
    <title>Chaaru's Foods - Redirecting…</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Raleway', sans-serif;
        background: linear-gradient(135deg, #DFBD69 0%, #C9A54F 50%, #B8944A 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
        animation: fadeIn 0.8s ease-out;
      }

      .logo {
        font-size: 2.5rem;
        font-weight: 700;
        color: white;
        margin-bottom: 1.5rem;
        animation: slideDown 0.6s ease-out;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .message {
        font-size: 1.1rem;
        color: white;
        font-weight: 600;
        margin-bottom: 2rem;
        animation: slideUp 0.8s ease-out;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      .loader {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto;
      }

      .loader div {
        position: absolute;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      .loader div:nth-child(2) {
        animation-delay: -0.5s;
      }

      .link {
        margin-top: 2rem;
        opacity: 0;
        animation: fadeIn 1s ease-out 1s forwards;
      }

      .link a {
        color: white;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border: 2px solid white;
        border-radius: 8px;
        transition: all 0.3s ease;
        display: inline-block;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .link a:hover {
        background: white;
        color: #C9A54F;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
      }

      .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ripple {
        0% {
          top: 36px;
          left: 36px;
          width: 0;
          height: 0;
          opacity: 1;
        }
        100% {
          top: 0;
          left: 0;
          width: 72px;
          height: 72px;
          opacity: 0;
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0) translateX(0);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-20px) translateX(10px);
          opacity: 0.8;
        }
      }

      @media (max-width: 768px) {
        .logo {
          font-size: 1.75rem;
        }
        .message {
          font-size: 0.95rem;
          padding: 0 1rem;
        }
        .loader {
          width: 60px;
          height: 60px;
        }
        .link a {
          font-size: 0.85rem;
          padding: 0.6rem 1.2rem;
        }
      }

      @media (max-width: 480px) {
        .logo {
          font-size: 1.5rem;
        }
        .message {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
      <div class="logo">Chaaru's Foods</div>
      <div class="message">Preparing your delicious experience...</div>
      
      <div class="loader">
        <div></div>
        <div></div>
      </div>

      <div class="link">
        <a href="/chaarusFoods.html">Click here if not redirected</a>
      </div>
    </div>

    <script>
      // Create floating particles
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.width = Math.random() * 8 + 3 + 'px';
        particle.style.height = particle.style.width;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 3 + 's';
        particle.style.animationDuration = Math.random() * 2 + 2 + 's';
        particlesContainer.appendChild(particle);
      }
    </script>
  </body>
</html>
