<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaaru's Foods</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            raleway: ['Raleway', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    .font-manrope {
      font-family: 'Manrope', sans-serif;
    }
    /* Prevent body scroll when sidebar is open */
    body.no-scroll {
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-pink-100 font-raleway">

  <header class="shadow py-5 px-5">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-pink-500">
        Chaaru's Foods</h1>
      <i class="fa-solid fa-bars block md:hidden text-2xl text-pink-500 cursor-pointer"></i>
      <ul class="hidden md:flex space-x-4">
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Home</a></li>
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Products</a></li>
        <li class="font-semibold text-xl text-pink-500 hover:text-pink-700 hover:scale-110 transition-all duration-300 px-1"><a href="#">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Mobile Sidebar -->
  <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-pink-100 shadow-lg transform -translate-x-full transition-transform duration-300 z-40 md:hidden">
    <div class="flex justify-between items-center p-5 border-b">
      <h2 class="text-xl font-bold text-pink-600">Menu</h2>
      <i class="fa-solid fa-times text-2xl text-pink-600 cursor-pointer" onclick="toggleSidebar()"></i>
    </div>
    <ul class="flex flex-col space-y-6 p-6">
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Home</a></li>
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Products</a></li>
      <li><a href="#" class="text-lg text-pink-500 font-semibold hover:text-pink-700">Contact</a></li>
    </ul>
  </div>

  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden" onclick="toggleSidebar()"></div>

  <!-- Toggle Sidebar Script -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const body = document.body;

      const isOpen = !sidebar.classList.contains('-translate-x-full');

      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
        body.classList.remove('no-scroll');
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        body.classList.add('no-scroll');
      }
    }
  </script>
  <section class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center px-6 py-5 max-w-7xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-[400px] w-[1200px]">
        <div id="left" class="py-5">
            <div class="rounded-2xl shadow-2xl bg-pink-300 py-2 bg-opacity-70">
            <div class="flex justify-start mx-10 my-10">
                <h1 class="font-manrope font-bold text-5xl text-pink-500 px-5">Contact us:</h1>
            </div>
            <a href="https://api.whatsapp.com/send/?phone=%2B918652530914&text&type=phone_number&app_absent=0" class="flex justify-start text-4xl mx-10 my-10 bg-opacity-50 bg-pink-200 border-2 border-white rounded-2xl py-3 hover:scale-105 transition-all duration-300 w-[400px]">
                <i class="fa-solid fa-phone text-2xl mx-5 text-pink-700"></i>
                <h1 class="font-manrope font-bold text-3xl text-pink-500 ">+91-8652530914</h1>
            </a>
            <a href="https://api.whatsapp.com/send/?phone=%2B917045727768&text&type=phone_number&app_absent=0" class="flex justify-start text-4xl mx-10 my-10 bg-opacity-50 bg-pink-200 border-2 border-white rounded-2xl py-3 hover:scale-105 transition-all duration-300 w-[400px]">
                <i class="fa-solid fa-phone text-2xl mx-5 text-pink-700"></i>
                <h1 class="font-manrope font-bold text-3xl text-pink-500 ">+91-7045727768</h1>
            </a>
            <a href="https://www.instagram.com/chaarus_foods/" class="flex justify-start text-4xl mx-10 my-10 bg-opacity-50 bg-pink-200 border-2 border-white rounded-2xl py-3 hover:scale-105 transition-all duration-300 w-[400px]">
                <i class="fa-brands fa-instagram text-2xl mx-5 text-pink-700"></i>
                <h1 class="font-manrope font-bold text-3xl text-pink-500">@chaarus_foods</h1>
            </a>
            <a href="https://share.google/GB9vishGVYR91IbN5" class="flex justify-start text-4xl mx-10 my-10 bg-opacity-50 bg-pink-200 border-2 border-white rounded-2xl py-3 hover:scale-105 transition-all duration-300 w-[400px]">
                <i class="fa-solid fa-location-dot text-2xl mx-5 text-pink-700"></i>
                <h1 class="font-manrope font-bold text-3xl text-pink-500">Location</h1>
            </a>
            </div>
        </div>
        <div id="right" class="flex justify-center">
            <img src="assets\WhatsApp Image 2025-08-11 at 20.03.55_6709003d.jpg" loading="lazy" class="w-full max-w-xs md:max-w-md rounded-2xl shadow-2xl">
        </div>
    </div>
  </section>

</body>
</html>
